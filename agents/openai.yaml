interface:
  display_name: "Build CP Problem Package"
  short_description: "Build and audit CP packages with optional Polyhedron ZIP"
  default_prompt: "Use $build-cp-testdata to inventory this original-problem folder, ask the fixed intake questionnaire, record the user's explicit choice whether to generate polyhedron.zip, freeze a concise and natural Chinese Markdown statement, apply the same strict Markdown and render checks to its complete human-readable editorial, use $...$ and $$...$$ instead of unsupported \\(...\\) or \\[...\\] delimiters, omit public case ids, merge identical public subtask constraints into one scoring unit, audit existing data before regeneration, derive data/config.yaml from the frozen scoring units, validate and score-test every case, produce the optional Polyhedron ZIP only after acceptance when selected, and finish with an evidence-backed go/no-go audit."
